# LEGO City Undercover - Cherry Tree Hills (NOON)
# lcu_lighting.glsl is written by converter/export_lcu.py from your own LEGO_CITY_NOON_LIGHTING.LED
clouds=off
oldLighting=false
underwaterOverlay=false
vignette=false
sun=false
moon=false
separateAo=false
colortex0MipmapEnabled=true
screen=<profile> <empty> SHADOWS SHADOW_STRENGTH SHADOW_HALF shadowMapResolution SHADOW_FILTER <empty> BLOOM EXPOSURE FOG_AMOUNT FXAA NORMAL_MAPS NORMAL_STRENGTH NORMAL_FLIP_Y
sliders=BLOOM EXPOSURE FOG_AMOUNT NORMAL_STRENGTH SHADOW_STRENGTH SHADOW_HALF shadowMapResolution

# Quality presets (the Profile button): LOW has no shadows, MEDIUM cheap shadows near you, HIGH the full set
profile.LOW=SHADOWS=0 NORMAL_MAPS=0 FXAA=1
profile.MEDIUM=SHADOWS=1 SHADOW_HALF=48.0 shadowMapResolution=1024 SHADOW_FILTER=0 NORMAL_MAPS=1 FXAA=1
profile.HIGH=SHADOWS=1 SHADOW_HALF=80.0 shadowMapResolution=2048 SHADOW_FILTER=1 NORMAL_MAPS=1 FXAA=1
# no shadow pass at all when shadows are off (the mod then draws nothing into it either)
program.shadow.enabled=SHADOWS
