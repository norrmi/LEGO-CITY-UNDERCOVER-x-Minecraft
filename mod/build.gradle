plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"lcucraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		client {
			programArgs "--width", "1280", "--height", "720"
			vmArg "-Dlcucraft.dataDir=" + file('../build/lcu_data').absolutePath
		}
		devTest {
			inherit client
			name "Dev Test (screenshots)"
			vmArg "-Dlcucraft.devTest=Cherry Tree Hills"
			vmArg "-Dlcucraft.dataDir=" + file('../build/lcu_data').absolutePath
			// dev machines with very long project paths: Windows cannot load DLLs past 260 chars (error 206)
			if (project.hasProperty('nativesDir')) {
				vmArg "-Dorg.lwjgl.librarypath=${project.property('nativesDir')}"
				vmArg "-Djava.library.path=${project.property('nativesDir')}"
			}
		}
		devPerf {
			inherit client
			name "Dev Test (FPS)"
			vmArg "-Dlcucraft.devTest=Cherry Tree Hills"
			vmArg "-Dlcucraft.devPerf=true"
			vmArg "-Dlcucraft.dataDir=" + file('../build/lcu_data').absolutePath
		}
		server {
			vmArg "-Dlcucraft.dataDir=" + file('../build/lcu_data').absolutePath
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Fabric API travels inside the mod jar (jar-in-jar): players only need Fabric Loader. Loom's include is not
	// transitive, so every module of the Fabric API bundle is nested on its own (list from the bundle's POM)
	[
		"fabric-api-base", "fabric-api-lookup-api-v1", "fabric-biome-api-v1", "fabric-block-api-v1",
		"fabric-blockrenderlayer-v1", "fabric-command-api-v1", "fabric-commands-v0", "fabric-containers-v0",
		"fabric-content-registries-v0", "fabric-convention-tags-v1", "fabric-crash-report-info-v1",
		"fabric-data-generation-api-v1", "fabric-dimensions-v1", "fabric-entity-events-v1",
		"fabric-events-interaction-v0", "fabric-events-lifecycle-v0", "fabric-game-rule-api-v1",
		"fabric-gametest-api-v1", "fabric-item-api-v1", "fabric-item-groups-v0", "fabric-key-binding-api-v1",
		"fabric-keybindings-v0", "fabric-lifecycle-events-v1", "fabric-loot-api-v2", "fabric-loot-tables-v1",
		"fabric-mining-level-api-v1", "fabric-models-v0", "fabric-networking-api-v1", "fabric-networking-v0",
		"fabric-object-builder-api-v1", "fabric-particles-v1", "fabric-registry-sync-v0", "fabric-renderer-api-v1",
		"fabric-renderer-indigo", "fabric-renderer-registries-v1", "fabric-rendering-data-attachment-v1",
		"fabric-rendering-fluids-v1", "fabric-rendering-v0", "fabric-rendering-v1", "fabric-resource-conditions-api-v1",
		"fabric-resource-loader-v0", "fabric-screen-api-v1", "fabric-screen-handler-api-v1", "fabric-textures-v0",
		"fabric-transfer-api-v1", "fabric-transitive-access-wideners-v1"
	].each { include fabricApi.module(it, project.fabric_api_version) }
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
